<nav class="navbar navbar-light navbar-fixed navbar-expand-md mb-4" aria-label="Main">
    <a class="navbar-brand" href="/">{{ site.title | default: "Evolveum"}}</a>
    <button class="navbar-toggler navbar-light" type="button" data-ev-toggle aria-controls="navbar-list" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon" aria-hidden="true"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbar-list">
        <ul class="navbar-nav ml-auto mr-5">
            {% for nav in site.data.navbar %}
            {%- assign primary_active = false -%}
            {%- if site.navigation.sidebar == 'section' and nav.url == page.nav_primary_url -%}{%- assign primary_active = true -%}{%- endif %}
            <li class="nav-item">
                <a class="nav-link" href="{{ nav.url }}"{% if primary_active %} aria-current="true"{% endif %}>{{ nav.label | escape }}</a>
            </li>
            {% endfor %}
        </ul>

        <button type="button" id="searchToggle" class="ev-search-trigger mt-2 mt-md-0 mr-sm-2" aria-haspopup="dialog">
            <span>Search</span>
            <i class="fas fa-search" aria-hidden="true"></i>
        </button>
    </div>
</nav>
