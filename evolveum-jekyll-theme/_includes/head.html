<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    {% if page.description %}
    <meta name="description" content="{{ page.description | escape }}" />
    {% endif %} {% if page.keywords %}
    <meta name="keywords" content="{{ page.keywords | escape }}" />
    {% endif %} {% if page.author %}
    <meta name="author" content="{{ page.author | escape }}" />
    {% endif %}
    <link rel="stylesheet" href="/assets/main.css" />
    <link rel="stylesheet" href="/assets/css/datatables.min.css" />
    <!--<link rel="stylesheet" href="/assets/css/fontawesome.min.css" />
    <link rel="stylesheet" href="/assets/css/v5-font-face.min.css" />--->
    <link rel="stylesheet" href="/assets/css/all.min.css" />
    <link rel="stylesheet" href="/assets/css/v4-shims.min.css" />
    <link rel="stylesheet" href="/assets/css/rouge-github.css" />
    <link rel="stylesheet" href="/assets/css/font-evosome.css" />
    <link rel="stylesheet" href="/assets/css/ui.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
        rel="preload"
        href="/assets/fonts/roboto-regular.woff2"
        as="font"
        type="font/woff2"
        crossorigin
    />
    <link
        rel="preload"
        href="/assets/fonts/roboto-bold.woff2"
        as="font"
        type="font/woff2"
        crossorigin
    />
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap"
        rel="stylesheet"
    />
    <link
        rel="apple-touch-icon"
        href="/assets/favicon/apple-touch-icon.png"
        sizes="72x72"
    />
    <link
        rel="icon"
        type="image/png"
        href="/assets/favicon/favicon32.png"
        sizes="32x32"
    />
    <link
        rel="icon"
        type="image/png"
        href="/assets/favicon/favicon16.png"
        sizes="16x16"
    />
    <link rel="shortcut icon" href="/assets/favicon/favicon.ico" />
    <link
        rel="sitemap"
        type="application/xml"
        title="Sitemap"
        href="/sitemap.xml"
    />
    <title>
        {% if page.title %}{{ page.title | strip_html }} - {{ site.title }}{% else %}{{
        site.title }}{% endif %}
    </title>
</head>
