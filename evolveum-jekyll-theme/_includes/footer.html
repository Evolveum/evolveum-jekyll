<footer class="ev-footer">
  <div class="ev-footer__body">
    <div class="ev-footer__brand">
      <object type="image/svg+xml" data="/assets/images/evolveum-logo.svg" class="ev-footer__logo" role="img" aria-label="Evolveum" width="170" height="42"></object>
      <p class="ev-footer__description">{{ site.description | default: "Site description placeholder"}}</p>
    </div>
    <nav class="ev-footer__column" aria-labelledby="ev-footer-site">
      <h2 id="ev-footer-site" class="ev-footer__heading">{{ site.shortname | default: "Site" }}</h2>
      <ul class="ev-footer__list">
        <li><a href="/sitemap/">Sitemap</a></li>
        <li><a href="/about/">About the site</a></li>
        <li><a href="/copyright/">Copyright</a></li>
      </ul>
    </nav>
    {%- include footer-columns.html -%}
  </div>
  <p class="ev-footer__copyright">
    <a href="https://{{ site.environment.docsUrl }}/copyright/">Copyright &copy; 2011-{{ site.time | date: '%Y' }} Evolveum s.r.o., CC BY-NC-ND</a>
  </p>
</footer>
