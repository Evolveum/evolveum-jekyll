{%- if site.environment.name contains "docs" %}
<div id="select-version" class="ev-version-select"{% unless page.url contains "/midpoint/reference" %} hidden{% endunless %}>
  <label class="ev-aside__title" for="select-version-picker">Documentation version</label>
  <select class="custom-select versioningButton" id="select-version-picker">
    <option data-tokens="master">Development</option>
    {%- assign versions = site.data.midpoint-versions | reverse %}
    {%- for v in versions %}
      {%- if v.docsDisplayBranch != null %}
    <option data-tokens="{{ v.docsBranch }}">{{ v.docsDisplayBranch }}</option>
      {%- endif %}
    {%- endfor %}
    <option data-tokens="before-4.8">4.7 and earlier</option>
  </select>
</div>
{%- endif %}
